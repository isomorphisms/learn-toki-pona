name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-and-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run content and progress tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run offline browser smoke test
        run: npm run test:browser

  rebuild-and-verify-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android signing tools
        run: sdkmanager "build-tools;35.0.1"

      - name: Download pinned Apktool
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar
          echo "effb69dab2f93806cafc0d232f6be32c2551b8d51c67650f575e46c016908fdd  /tmp/apktool.jar" \
            | sha256sum --check

      - name: Rebuild, sign, and verify APK
        run: |
          scripts/build_apk.sh \
            /tmp/apktool.jar \
            "$ANDROID_SDK_ROOT/build-tools/35.0.1/lib/apksigner.jar"

      - name: Check rebuilt APK
        run: test -s build/Toki-Pona-Drills-v1.0.1.apk
